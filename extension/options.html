<!doctype html>
<meta charset="utf-8">
<title>Hoardly</title>
<style>
  :root { color-scheme: light dark; font: 14px -apple-system, system-ui, sans-serif; }
  body { margin: 20px; max-width: 520px; }
  p { opacity: .75; }
  details { margin-top: 16px; }
</style>
<h2>Hoardly</h2>
<label><input type="checkbox" id="enabled"> Enabled — take over downloads in this browser</label>
<p>Turn this off to let the browser download as usual; switch it back on whenever you want Hoardly.</p>
<p>Hoardly must be running. Click Connect, then confirm in the Hoardly dialog.</p>
<button id="connect">Connect to Hoardly</button>
<p id="result"></p>
<details>
  <summary>Pair with a token instead</summary>
  <p>Copy the token from Hoardly → Settings → Browsers.</p>
  <input id="token" size="40">
  <button id="save">Save &amp; test</button>
</details>
<script src="options.js"></script>
