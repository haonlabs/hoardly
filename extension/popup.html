<!doctype html>
<meta charset="utf-8">
<title>Hoardly</title>
<style>
  :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
  body { margin: 0; width: 340px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #8884; }
  header strong { font-size: 14px; }
  #status { font-size: 12px; opacity: .75; }
  ul { list-style: none; margin: 0; padding: 4px 0; max-height: 320px; overflow: auto; }
  li { display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { display: block; opacity: .6; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid #8886; background: transparent; cursor: pointer; }
  button:hover { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  p { margin: 12px; opacity: .75; }
</style>
<header><strong>Hoardly</strong><span id="status">Checking…</span></header>
<ul id="list"></ul>
<p id="empty" hidden></p>
<script src="rules.js"></script>
<script src="popup.js"></script>
